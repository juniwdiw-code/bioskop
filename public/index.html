<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sistem Tiket Bioskop</title>
<style>
:root{--bg:#fafaf9;--card:#fff;--tx:#18181b;--mu:#8a8a93;--ac:#18181b;--ac2:#fff;--bd:#ececea;--ok:#15803d;--seat:#f1f1ef;--taken:#e4e4e1;--er:#dc2626;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e10;--card:#161618;--tx:#f4f4f5;--mu:#8b8b94;--ac:#f4f4f5;--ac2:#0e0e10;--bd:#26262a;--ok:#4ade80;--seat:#1f1f23;--taken:#26262a;--er:#f87171}}
:root[data-theme="dark"]{--bg:#0e0e10;--card:#161618;--tx:#f4f4f5;--mu:#8b8b94;--ac:#f4f4f5;--ac2:#0e0e10;--bd:#26262a;--ok:#4ade80;--seat:#1f1f23;--taken:#26262a;--er:#f87171}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
#view{flex:1 1 0;min-height:0;overflow:hidden}
.adm #view{overflow-y:auto;scrollbar-width:none}.adm #view::-webkit-scrollbar{display:none}
#fit{width:100%}
.pg{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--mu);margin-top:6px}
.pg .btn{width:auto;margin:0;padding:8px 14px;font-size:.85rem}
.lgs{font-size:.82rem;color:var(--mu);margin-top:3px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
.wrap{max-width:480px;margin:0 auto;padding:16px 18px;height:100dvh;display:flex;flex-direction:column}
header p{margin:4px 0 0;color:var(--mu);font-size:.9rem}
h1{font-size:1.5rem;margin:0;letter-spacing:-.02em}
.steps{display:flex;gap:4px;margin:18px 0 20px}
.steps i{flex:1;height:3px;border-radius:3px;background:var(--bd)}
.steps i.on{background:var(--ac)}
h2{margin:0 0 14px;font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}
label{display:block;font-size:.85rem;color:var(--mu);margin-bottom:6px}
input{width:100%;padding:14px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font-size:1rem;outline:0}
input:focus{border-color:var(--tx)}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:15px 16px;margin-bottom:10px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font-size:1rem;cursor:pointer}
.opt small{color:var(--mu)}
.opt:hover,.opt.sel{border-color:var(--tx)}
.btn{display:block;width:100%;padding:14px;margin-top:14px;border:0;border-radius:12px;background:var(--ac);color:var(--ac2);font-size:1rem;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--mu);margin-top:4px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.screen{text-align:center;font-size:.7rem;letter-spacing:.3em;color:var(--mu);border-top:2px solid var(--tx);padding-top:6px;margin:0 20px 20px}
.hall{display:grid;grid-template-columns:16px repeat(4,1fr) 12px repeat(4,1fr) 12px repeat(4,1fr);gap:4px;align-items:center}
.rl{font-size:.7rem;color:var(--mu);text-align:center}
.seat{width:100%;aspect-ratio:1;padding:0;border:1.5px solid var(--mu);border-radius:6px;background:var(--card);color:var(--tx);font-size:.65rem;font-weight:500;cursor:pointer}
.seat.taken{background:var(--taken);border-color:var(--taken);color:var(--er);font-size:.8rem;font-weight:700;cursor:not-allowed}
.seat.sel{background:var(--ac);border-color:var(--ac);color:var(--ac2)}
.legend{display:flex;gap:18px;justify-content:center;font-size:.8rem;color:var(--mu);margin-top:16px}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:4px;background:var(--card);border:1.5px solid var(--mu)}
.sw.s1{background:var(--ac);border-color:var(--ac)}.sw.s2{background:var(--taken);border-color:var(--taken)}
.chips.big button{padding:14px;font-weight:600}
.chips button.on{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
.chips.pm{flex-wrap:wrap}.chips.pm button{flex:1 1 40%;padding:12px 4px}
.pay-info{margin-top:14px;text-align:center}.pay-info .row{text-align:left}
.qr{display:grid;grid-template-columns:repeat(11,1fr);width:176px;margin:0 auto 10px;padding:8px;background:#fff;border:1px solid var(--bd);border-radius:10px}
.qr i{display:block;aspect-ratio:1}.qr i.b{background:#000}
select{width:100%;padding:14px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font-size:1rem}
.fr{display:grid;gap:8px}
.del{border:0;background:transparent;color:var(--er);cursor:pointer;font-size:.85rem}
.acard{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.big2{font-size:1.6rem;font-weight:700}
.stf{display:block;margin:34px auto 0;background:none;border:0;color:var(--mu);opacity:.3;font-size:.68rem;cursor:pointer}.stf:hover{opacity:.8}
.alert{margin-bottom:18px;padding:12px 14px;border:1px solid var(--er);border-left-width:4px;border-radius:10px;font-size:.88rem;line-height:1.5}
.cd{margin-top:16px;text-align:center;font-size:.85rem;color:var(--mu)}
.cdbar{height:3px;background:var(--bd);border-radius:3px;margin:8px 0;overflow:hidden}
#cdb{display:block;height:100%;width:100%;background:var(--ac);transition:width 5s linear}
.cdstop{background:none;border:0;color:var(--mu);text-decoration:underline;cursor:pointer;font-size:.8rem;padding:4px}
.home #view{display:flex;align-items:center}
.home header,.home #view{text-align:center}
.home h1{font-size:1.9rem}
.home #view .note{text-align:center!important}
.home input{text-align:center}
.home .chips{justify-content:center}
.home #view,.home header{width:100%}
.sum{margin-top:14px;font-size:.9rem;min-height:1.4em}
.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--bd);gap:12px}
.row span:first-child{color:var(--mu)}.row b{text-align:right}
.msg{margin-top:10px;font-size:.9rem;font-weight:500}
.err{color:var(--er)}.ok{color:var(--ok)}
.chips{display:flex;gap:6px;margin-top:8px}
.chips button{flex:1;padding:9px 4px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);cursor:pointer}
/* Struk */
.tk{background:var(--card);border:1px solid var(--bd);border-radius:20px;overflow:hidden}
.tk-h{background:var(--ac);color:var(--ac2);padding:22px 22px 24px}
.tk-h small{opacity:.7;letter-spacing:.18em;font-size:.68rem}
.tk-h h3{margin:6px 0 2px;font-size:1.6rem;letter-spacing:-.02em}
.tk-h p{margin:0;opacity:.75;font-size:.9rem}
.tk-b{padding:20px 22px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.meta small,.k{display:block;color:var(--mu);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px}
.meta b{font-size:1rem}
.seats{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.seats span{padding:4px 10px;border:1px solid var(--tx);border-radius:8px;font-weight:600;font-size:.85rem}
.perf{position:relative;border-top:2px dashed var(--bd);margin:0}
.perf:before,.perf:after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--bd)}
.perf:before{left:-11px}.perf:after{right:-11px}
.pr{display:flex;justify-content:space-between;padding:5px 0;font-size:.92rem}
.pr span:first-child{color:var(--mu)}
.tot{border-top:1px solid var(--bd);margin-top:8px;padding-top:10px;font-size:1.1rem;font-weight:700}
.tot span:first-child{color:var(--tx)}
.stamp{display:inline-block;margin-top:12px;padding:4px 12px;border:2px solid var(--ok);color:var(--ok);border-radius:8px;font-weight:800;letter-spacing:.15em;transform:rotate(-4deg)}
.bar{display:flex;justify-content:center;gap:2px;height:46px;margin:18px 0 6px}
.bar i{display:block;background:var(--tx)}
.code{text-align:center;font-family:ui-monospace,Menlo,monospace;letter-spacing:.25em;font-size:.8rem;color:var(--mu)}
.note{text-align:center;color:var(--mu);font-size:.78rem;margin:14px 0 0}
.pulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-right:8px;animation:pl 1.2s ease-in-out infinite}@keyframes pl{50%{opacity:.2}}
@media print{header,.steps,.noprint{display:none}body{background:#fff}html,body{height:auto;overflow:visible}.wrap{height:auto;display:block}#view{overflow:visible}#fit{zoom:1!important}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>Tiket Bioskop</h1><p>Pesan tiket bioskop dengan mudah</p></header>
<div id="view"><div id="fit"></div></div>
<div id="foot" class="noprint"></div>
</div>
<script>
let DB={films:[],shows:[],taken:{},sales:[],menu:[],paket:[],cfg:{ppn:[{m:0,r:0}],wk:0,ml:0,jm:"18:00"},promo:[],fsales:[],orders:[]};
let ORK=null,REV=0,TK={admin:null,kasir:null},BUSY=false;
try{ORK=sessionStorage.getItem("ordk")}catch(e){}
try{Object.assign(TK,JSON.parse(sessionStorage.getItem("tk")||"{}"))}catch(e){}
const saveTK=()=>{try{sessionStorage.setItem("tk",JSON.stringify(TK))}catch(e){}};
const FILMS=DB.films;
const PC={};
/* ===== Komunikasi dengan server (Vercel + Neon) ===== */
async function api(path,body){
  const h={"Content-Type":"application/json"},t=TK[ROLE];
  if(t)h.Authorization="Bearer "+t;
  let r,j={};
  try{r=await fetch(path,{method:body?"POST":"GET",headers:h,body:body?JSON.stringify(body):undefined,cache:"no-store"});j=await r.json()}
  catch(e){return{ok:false,status:0,j:{error:"Tidak dapat terhubung ke server."}}}
  if(r.status===401&&t&&path!=="/api/login")expired();
  return{ok:r.ok&&j.ok!==false,status:r.status,j}
}
async function act(a,p){
  if(BUSY)return{ok:false,busy:true,j:{error:"Sedang memproses, tunggu sebentar."}};
  BUSY=true;
  try{const r=await api("/api/act",{action:a,...p});if(r.j.state)sync(r.j.state);return r}
  finally{BUSY=false}
}
const sa=async(a,p,hm)=>{const r=await act(a,p);if(r.busy)return r;AM=r.ok?"":esc(r.j.error||"Gagal menyimpan.");if(r.ok&&hm!==undefined)HM=hm;render();return r};
function expired(){TK[ROLE]=null;saveTK();if(ROLE==="kasir")AUTHK=false;else if(ROLE==="admin")AUTH=false;AM="";REV=0;render()}
function logout(){TK[ROLE]=null;saveTK();if(ROLE==="kasir")AUTHK=false;else AUTH=false;DB.sales=[];DB.fsales=[];DB.orders=[];DB.promo=[];setRole("pelanggan")}
const METODE=[{n:"Tunai"},{n:"QRIS"},{n:"Transfer Bank"},{n:"E-Wallet"}];
const JADWAL=["13:00","16:00","19:00"];
const cln=s=>s.replace(/['"\\<>&`$]/g,"").trim();
const paketAll=()=>[{n:"Tiket Saja",i:[]},...DB.paket];
const pkt=n=>paketAll().find(x=>x.n===n)||{n,i:[]};
const tixAt=(fi,j,t)=>{const d=new Date(t+"T00:00:00").getDay(),c=DB.cfg;const p=(d===0||d===6?c.wk:0)+(j>=c.jm?c.ml:0);return Math.round(FILMS[fi].h*(1+p/100)/500)*500};
const tix=()=>tixAt(S.film,S.jadwal,S.tgl);
const hrgP=(n,fi)=>tix()+pkt(n).i.reduce((t,x)=>t+((DB.menu.find(m=>m.n===x)||{}).h||0),0);
const isi=n=>{const p=pkt(n);return p.i.length?["Tiket",...p.i].join(" + "):"Tiket masuk saja"};
const MAX=10, BARIS="ABCDEFGH";
const AUDI=[{n:"Audi 1"},{n:"Audi 2"},{n:"Audi 3"},{n:"Audi 4"},{n:"Audi 5"}];
function hall(){const t=DB.taken[S.show+"|"+S.tgl]||[],a=[];for(const b of BARIS)for(let n=1;n<=12;n++)a.push({no:b+n,r:b,n,terisi:t.includes(b+n)});return a}
const p2=n=>String(n).padStart(2,"0");
const lk=t=>{const d=new Date(t);return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())};
const addD=(t,n)=>{const d=new Date(t+"T00:00:00");d.setDate(d.getDate()+n);return lk(d.getTime())};
const rp=n=>"Rp"+n.toLocaleString("id-ID");
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
let S,ROLE="pelanggan",AUTH=!!TK.admin,AUTHK=!!TK.kasir,AT="Kasir",AM="",RS=false,LP=0,HM="";
function reset(){try{sessionStorage.removeItem("ordk")}catch(e){}const c=(S&&S.channel)||"Kasir";S={ost:"",channel:c,step:0,nama:"",film:null,audi:null,jadwal:null,kursi:[],tiket:null,metode:c==="Aplikasi"?"QRIS":"Tunai",bayar:0,pesan:"",err:false,kembali:0,kode:"",waktu:null,promo:"",tgl:lk(Date.now())}}
reset();
const go=n=>{S.step=n;S.pesan="";render()};
const ppnRate=h=>{let r=0;[...DB.cfg.ppn].sort((a,b)=>a.m-b.m).forEach(t=>{if(h>=t.m)r=t.r});return r/100};
const pct=x=>Math.round(x*100)+"%";
const sub=()=>hrgP(S.tiket,S.film)*S.kursi.length;
const rate=()=>ppnRate(hrgP(S.tiket,S.film));
const promoF=c=>{c=(c||"").toUpperCase();const p=DB.promo.find(x=>x.c===c)||PC[c];return p&&p.on&&(p.h<0||new Date(S.tgl+"T00:00:00").getDay()===p.h)?p:null};
const disc=()=>{const p=promoF(S.promo);if(!p)return 0;const b=sub();return Math.min(b,p.t==="p"?Math.round(b*p.v/100):p.v)};
const ppn=()=>Math.round((sub()-disc())*rate());
const total=()=>sub()-disc()+ppn();

function kode(){const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let k="";for(let i=0;i<8;i++)k+=c[Math.floor(Math.random()*c.length)];return k}
function barcode(k){
  let h=0,out="";
  for(let i=0;i<48;i++){h=(h*31+k.charCodeAt(i%k.length)+i*7)>>>0;out+=`<i style="width:${1+h%3}px"></i>`}
  return out;
}

const BLN=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
let RP="Harian",RT=lk(Date.now());
function setRT(v){if(!/^\d{4}-\d{2}-\d{2}$/.test(v||""))return;RT=v;render()}
function setRP(p){RP=p;render()}
function splitS(x){
  const base=x.sb!==undefined?x.sb:x.amt;
  const ad=pkt(x.tp).i.reduce((t,n)=>t+((DB.menu.find(m=>m.n===n)||{}).h||0),0)*x.q;
  const fd=x.fd!==undefined?x.fd:Math.min(ad,base);
  const tk=x.tk!==undefined?x.tk:base-fd;
  return {tk,fd,px:x.px||0,tot:x.amt,it:x.it||pkt(x.tp).i};
}
function struk(d){
  return `<div class="tk">
      <div class="tk-h"><small>${d.ch==="Aplikasi"?"E-TIKET":"TIKET"} BIOSKOP</small><h3>${esc(d.f)}</h3><p>${esc(d.g)} · ${d.d} menit</p></div>
      <div class="tk-b"><div class="meta">
        <div><small>Tanggal tayang</small><b>${d.tgl}</b></div>
        <div><small>Jam tayang</small><b>${d.j}</b></div>
        <div><small>Audi</small><b>${d.a}</b></div>
        <div><small>Paket</small><b>${esc(d.tp)}</b></div>
        <div><small>Pemesan</small><b>${esc(d.n)}</b></div>
        <div><small>Dibeli via</small><b>${esc(d.ch)}</b></div>
      </div>
      <div style="margin-top:16px"><small class="k">Kursi (${d.ks.length})</small><div class="seats">${d.ks.map(k=>`<span>${esc(k)}</span>`).join("")}</div></div>
      <div style="margin-top:14px"><small class="k">Isi paket (per kursi)</small><b>${isi(d.tp)}</b></div></div>
      <div class="perf"></div>
      <div class="tk-b">
        <div class="pr"><span>${d.q} × ${rp(d.hrg)}</span><span>${rp(d.sb)}</span></div>
        ${d.ds?`<div class="pr"><span>Diskon${d.pk?" ("+esc(d.pk)+")":""}</span><span>-${rp(d.ds)}</span></div>`:""}
        ${d.px!==undefined?`<div class="pr"><span>PPN (${pct(d.pr)})</span><span>${rp(d.px)}</span></div>`:""}
        <div class="pr"><span>Metode bayar</span><span>${esc(d.m)}</span></div>
        <div class="pr"><span>Dibayar customer</span><span>${rp(d.by)}</span></div>
        <div class="pr"><span>Kembalian</span><span>${rp(d.kb)}</span></div>
        <div class="pr tot"><span>Total</span><span>${rp(d.amt)}</span></div>
        <div class="stamp"${d.rf?' style="border-color:var(--er);color:var(--er)"':""}>${d.rf?"REFUND":"LUNAS"}</div>
        <div class="bar">${barcode(d.k)}</div><div class="code">${d.k}</div>
        <p class="note">Tunjukkan kode ini di pintu studio. Selamat menonton!</p>
      </div></div>`;
}
function strukLog(x){
  const f=FILMS.find(y=>y.j===x.f)||{g:"-",d:dur(x.f)};
  const tgl=new Date((x.td||lk(x.t))+"T00:00:00").toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  const ks=x.ks?x.ks.split(", "):[];
  return struk({ch:x.ch||"Kasir",f:x.f,g:f.g,d:f.d,tgl,j:x.j,a:AUDI[x.a].n,tp:x.tp,n:x.n||"-",ks,hrg:Math.round((x.sb!==undefined?x.sb:x.amt)/x.q),q:x.q,sb:x.sb!==undefined?x.sb:x.amt,px:x.px,pr:x.pr,m:x.m,by:x.by!==undefined?x.by:x.amt,kb:x.kb||0,amt:x.amt,k:x.k,rf:x.rf,ds:x.ds,pk:x.pk});
}
function viewStruk(i){RV=i;HM="";render()}
function closeStruk(){RV=null;render()}
function fit(){
  const b=$("view"),f=$("fit");f.style.zoom=1;
  const a=b.clientHeight,n=f.offsetHeight;
  if(n>a)f.style.zoom=Math.max(stf()?.75:.5,a/n);
}
addEventListener("resize",()=>fit());
function render(){render0();fit()}
function render0(){
  document.body.classList.toggle("home",ROLE==="pelanggan"&&S.step===0);
  document.body.classList.toggle("adm",stf());
  if(S.step!==6||stf()){if(CD){clearInterval(CD);CD=null}CDOFF=false}
  document.querySelector("h1").textContent=ROLE==="admin"?"Panel Admin":ROLE==="kasir"?"Panel Kasir":"Tiket Bioskop";
  document.querySelector("header p").style.display=stf()?"none":"";
  $("foot").innerHTML=ROLE==="pelanggan"&&S.step===0?`<div style="text-align:center;margin-top:34px"><button class="stf" style="display:inline;margin:0;padding:0;font:inherit;font-size:.75rem" onclick="setRole('kasir')">Tiket</button> <button class="stf" style="display:inline;margin:0;padding:0;font:inherit;font-size:.75rem" onclick="setRole('admin')">Bioskop</button></div>`:"";
  if(stf()){document.querySelector(".wrap").style.maxWidth="640px";return renderAdmin()}
  document.querySelector(".wrap").style.maxWidth=S.step===3?"720px":"";
  const v=$("fit");
  const back=`<button class="btn ghost" onclick="go(${S.step-1})">← Kembali</button>`;
  if(S.step===0){
    v.innerHTML=`<h2>Beli melalui</h2>
    <div class="chips big">${["Kasir","Aplikasi"].map(c=>`<button class="${S.channel===c?"on":""}" onclick="setChannel('${c}')">${c}</button>`).join("")}</div>
    <p class="note" style="text-align:left;margin:8px 0 0">${S.channel==="Kasir"?"Pembelian langsung di loket. Bisa bayar tunai, QRIS, transfer, atau e-wallet.":"Pembelian online lewat aplikasi. Pembayaran non-tunai."}</p>
    <h2 style="margin-top:22px">Data pelanggan</h2><label for="nama">Nama pelanggan</label>
    <input type="text" id="nama" placeholder="Masukkan nama" value="${esc(S.nama)}" autocomplete="name">
    <div class="msg err" id="m"></div><button class="btn" onclick="setNama()">Lanjut</button>`;
    $("nama").addEventListener("keydown",e=>{if(e.key==="Enter")setNama()});
  }else if(S.step===1){
    v.innerHTML=`<h2>Pilih film</h2>`+FILMS.map((f,i)=>!DB.shows.some(x=>x.f===f.j)?"":`<button class="opt ${S.film===i?"sel":""}" onclick="S.film=${i};S.show=null;go(2)"><span><b>${f.j}</b><br><small>${f.g} · ${f.d} menit · ${rp(f.h)}</small></span><span>›</span></button>`).join("")+back;
  }else if(S.step===2){

    <h2 style="margin-top:20px">Film terlaris</h2><div class="acard">${barChart(Object.entries(F).sort((a,b)=>b[1]-a[1]).slice(0,5),"tiket")}</div>
    <h2 style="margin-top:20px">Jam paling ramai</h2><div class="acard">${barChart(Object.entries(J).sort((a,b)=>b[1]-a[1]),"tiket")}</div>`;
    if(Object.keys(I).length)h+=`<h2 style="margin-top:20px">Makanan & minuman terjual</h2><div class="acard">`+Object.entries(I).map(([n,q])=>`<div class="row"><span>${esc(n)}</span><b>${q} porsi</b></div>`).join("")+`</div>`;
    if(RP!=="Harian"&&Object.keys(G).length)h+=`<h2 style="margin-top:20px">Rincian ${RP==="Tahunan"?"per bulan":"per tanggal"}</h2><div class="acard">`+Object.keys(G).sort().map(k=>{const g=G[k];return `<div class="row"><span style="color:var(--tx)">${gl(k)}<br><small class="lgs">Tiket ${rp(g.tk)} · Makanan ${rp(g.fd)}</small></span><b>${rp(g.tot)}</b></div>`}).join("")+`</div>`;
    h+=`<h2 style="margin-top:20px">Struk penjualan (${L.length})</h2>`+(L.length?`<div class="acard">`+L.map(o=>{const x=o.x,w=new Date(x.t).toLocaleString("id-ID",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
      return `<div class="row" style="align-items:center"><span style="color:var(--tx)"><b>${esc(x.n||"-")}</b><br><small class="lgs">${w} · ${o.fs?"Makanan konter":esc(x.f)} · ${esc(x.k)}${x.rf?" · REFUND":""}</small></span><span style="text-align:right"><b${x.rf?' class="err" style="text-decoration:line-through"':""}>${rp(x.amt)}</b>${o.fs?"":`<br><button class="del noprint" style="color:var(--tx);text-decoration:underline" onclick="viewStruk(${o.i})">Lihat struk</button>`}</span></div>`}).join("")+`</div>`:`<p class="note">Belum ada penjualan pada periode ini.</p>`)+
    `<button class="btn noprint" onclick="exportCSV()">Unduh CSV (Excel)</button><button class="btn ghost noprint" onclick="window.print()">Cetak laporan</button>`;
  }else if(AT==="Promo"){
    h+=`<h2>Kode promo (${DB.promo.length})</h2>`+(DB.promo.length?DB.promo.map((p,i)=>`<div class="acard"><div class="row" style="border:0;padding:0 0 4px"><b>${esc(p.c)}</b><span style="display:flex;gap:12px"><button class="del" style="color:var(--tx)" onclick="togPromo(${i})">${p.on?"Nonaktifkan":"Aktifkan"}</button><button class="del" onclick="delPromo(${i})">Hapus</button></span></div><small class="lgs">Diskon ${p.t==="p"?p.v+"%":rp(p.v)} · ${p.h<0?"Setiap hari":"Hanya hari "+HARI[p.h]} · ${p.on?"Aktif":"Nonaktif"}</small></div>`).join(""):`<p class="note" style="text-align:left">Belum ada promo.</p>`)+
    `<h2 style="margin-top:24px">Tambah promo</h2><div class="fr"><input type="text" id="pcd" placeholder="Kode (mis. PELAJAR)"><select id="pt"><option value="p">Diskon persen (%)</option><option value="n">Potongan rupiah (Rp)</option></select><input type="number" id="pv" placeholder="Nilai diskon" min="1" step="any"><select id="ph"><option value="-1">Setiap hari</option>${HARI.map((d,k)=>`<option value="${k}">Hanya hari ${d}</option>`).join("")}</select></div><button class="btn" onclick="addPromo()">Tambah promo</button><p class="note" style="text-align:left">Hari promo mengikuti tanggal tayang tiket. Diskon dihitung dari subtotal sebelum PPN. Pelanggan memasukkan kode di langkah pembayaran.</p>`;
  }else if(AT==="Pengaturan"){
    const c=DB.cfg,IM='type="number" min="0" step="500" style="width:120px;padding:8px 10px;text-align:right;font-size:.9rem"',IP='type="number" min="0" max="100" step="any" style="width:76px;padding:8px 10px;text-align:right;font-size:.9rem"',IS='type="number" min="0" max="200" step="any" style="width:76px;padding:8px 10px;text-align:right;font-size:.9rem"';
    h+=`<h2>Tarif PPN bertingkat</h2><p class="note" style="text-align:left;margin:-6px 0 10px">Tarif ditentukan oleh harga per kursi (tiket + isi paket). Tiap tingkat berlaku sampai batas tingkat berikutnya.</p>`+
    c.ppn.map((t,i)=>`<div class="row" style="align-items:center"><span style="display:flex;gap:8px;align-items:center;color:var(--tx)">Mulai Rp<input ${IM} ${i?"":"disabled"} value="${t.m}" onchange="setPpn(${i},'m',this.value)"></span><span style="display:flex;gap:8px;align-items:center"><input ${IP} value="${t.r}" onchange="setPpn(${i},'r',this.value)">%${i?`<button class="del" onclick="delPpn(${i})">Hapus</button>`:""}</span></div>`).join("")+
    `<button class="btn ghost" onclick="addPpn()">+ Tambah tingkat</button>
    <h2 style="margin-top:24px">Harga akhir pekan & jam malam</h2>
    <div class="row" style="align-items:center"><span style="color:var(--tx)">Akhir pekan (Sabtu–Minggu)</span><span style="display:flex;gap:8px;align-items:center">+<input ${IS} value="${c.wk}" onchange="setCfg('wk',this.value)">%</span></div>
    <div class="row" style="align-items:center"><span style="color:var(--tx)">Jam malam</span><span style="display:flex;gap:8px;align-items:center">+<input ${IS} value="${c.ml}" onchange="setCfg('ml',this.value)">%</span></div>
    <div class="row" style="align-items:center"><span style="color:var(--tx)">Jam malam mulai pukul</span><input type="time" value="${c.jm}" style="width:130px;padding:8px 10px" onchange="setCfg('jm',this.value)"></div>`+
    (FILMS.length?`<p class="note" style="text-align:left">Contoh: tiket ${esc(FILMS[0].j)} ${rp(FILMS[0].h)} menjadi ${rp(Math.round(FILMS[0].h*(1+(c.wk+c.ml)/100)/500)*500)} pada akhir pekan malam.</p>`:"")+
    `<p class="note" style="text-align:left">Kenaikan hanya berlaku pada harga tiket film, tidak pada makanan. Jika kedua kondisi terpenuhi, persentasenya dijumlahkan. PPN ikut menyesuaikan karena dihitung dari harga per kursi.</p>`;
  }else{
    const M={};let T=0,Q=0,PX=0;
    DB.shows.forEach(x=>{(M[x.f]=M[x.f]||{})[x.a+"|"+x.j]={a:x.a,j:x.j,q:0,r:0}});
    DB.sales.forEach(x=>{if(x.rf)return;const k=x.a+"|"+x.j;M[x.f]=M[x.f]||{};M[x.f][k]=M[x.f][k]||{a:x.a,j:x.j,q:0,r:0};M[x.f][k].q+=x.q;M[x.f][k].r+=x.amt;T+=x.amt;PX+=(x.px||0);Q+=x.q});
    let FT=0;DB.fsales.forEach(x=>{FT+=x.amt;PX+=x.px});T+=FT;const NT=DB.sales.filter(x=>!x.rf).length,RFL=DB.sales.filter(x=>x.rf);
    h+=`<div class="acard"><small class="k">Total pendapatan</small><div class="big2">${rp(T)}</div><small class="k" style="margin:6px 0 0">${Q} tiket · ${NT+DB.fsales.length} transaksi</small><small class="k" style="margin:6px 0 0">Termasuk PPN ${rp(PX)}</small>${FT?`<small class="k" style="margin:6px 0 0">Termasuk makanan konter ${rp(FT)}</small>`:""}${RFL.length?`<small class="k err" style="margin:6px 0 0">Refund ${RFL.length} transaksi (${rp(RFL.reduce((t,x)=>t+x.amt,0))}) tidak dihitung</small>`:""}</div>`+
    Object.entries(M).map(([f,o])=>{const rows=Object.values(o).sort((a,b)=>a.j<b.j?-1:1),fr=rows.reduce((t,x)=>t+x.r,0),fq=rows.reduce((t,x)=>t+x.q,0);
      return `<div class="acard"><div class="row" style="border:0;padding:0 0 4px"><b>${esc(f)}</b><b>${rp(fr)}</b></div><small class="k">${fq} tiket terjual</small>`+rows.map(x=>`<div class="row"><span>${x.j} · ${AUDI[x.a].n}</span><b>${x.q} tiket · ${rp(x.r)}</b></div>`).join("")+`</div>`}).join("")+
    `<button class="btn ghost" onclick="resetSales()">${RS?"Yakin? Tekan lagi untuk reset":"Reset penjualan & kursi"}</button>`;
  }
  v.innerHTML=h+`<button class="btn ghost noprint" onclick="logout()">Keluar admin</button>`;
  if(AM)$("view").scrollTo({top:0,behavior:"smooth"});
}
if(location.hash==="#admin")ROLE="admin";else if(location.hash==="#kasir")ROLE="kasir";
addEventListener("hashchange",()=>{ROLE=location.hash==="#admin"?"admin":location.hash==="#kasir"?"kasir":"pelanggan";REV=0;if(ROLE==="pelanggan")reset();render()});
async function boot(){
  await poll(true);
  if(ORK){const o=DB.orders.find(x=>x.k===ORK);if(o&&o.st==="menunggu"){S.kode=o.k;S.step=6;S.ost=o.st;S.channel=o.ch;S.nama=o.n}}
  render();
  setInterval(poll,3000);
}
render();boot();
</script>
</body>
</html>
